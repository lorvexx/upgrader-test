<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Апгрейдер: режим тестера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#100e1c;--s1:#1a1730;--s2:#252042;--tx:#efecfb;--mu:#9a95bb;--ac:#9b7bff;--win:#45e0b0;--lose:#ff6b8a;--gold:#ffc65c;--r0:#8a87a8;--r1:#4aa3ff;--r2:#a07bff;--r3:#ff5fc0;--r4:#ffc65c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f3fc;--s1:#fff;--s2:#ebe7fa;--tx:#1b1733;--mu:#6b6590;--ac:#6f4cf0;--win:#0f9c72;--lose:#d93a60;--gold:#c98a0a;--r0:#7d7a99;--r1:#2a82e0;--r2:#7b57e8;--r3:#d93a9c;--r4:#c98a0a}}
:root[data-theme="light"]{--bg:#f5f3fc;--s1:#fff;--s2:#ebe7fa;--tx:#1b1733;--mu:#6b6590;--ac:#6f4cf0;--win:#0f9c72;--lose:#d93a60;--gold:#c98a0a;--r0:#7d7a99;--r1:#2a82e0;--r2:#7b57e8;--r3:#d93a9c;--r4:#c98a0a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Manrope,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:var(--bg)}
h1{font:700 18px Unbounded,system-ui,sans-serif;margin:0}
.bal{background:var(--s1);border-radius:99px;padding:8px 16px;font:700 15px Unbounded,system-ui,sans-serif;display:flex;gap:8px;align-items:center;transition:transform .25s}
.bal i{font-style:normal;color:var(--gold)}
.bal.bump{transform:scale(1.08)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
nav button{flex:1;max-width:180px;padding:12px;border-radius:14px;background:var(--s1);color:var(--mu);font-weight:800}
nav button.on{background:var(--ac);color:#fff}
.wheelBox{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:8px auto 4px}
.wheelBox svg{width:100%;height:100%;overflow:visible}
.trk{fill:none;stroke:var(--s2);stroke-width:12}
.arc{fill:none;stroke:var(--win);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .5s}
.needle{fill:var(--tx);transform-origin:100px 100px}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.mid b{font:700 40px Unbounded,system-ui,sans-serif}
.mid span{color:var(--mu);font-size:13px}
.wheelBox.win{animation:glowW 1s}.wheelBox.lose{animation:glowL .6s}
@keyframes glowW{0%,100%{filter:none}40%{filter:drop-shadow(0 0 22px var(--win))}}
@keyframes glowL{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sec{margin-top:20px}
.sec h2{font:700 13px Unbounded,system-ui,sans-serif;margin:0 0 10px;color:var(--mu)}
.row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--s1);border-radius:16px;padding:8px;text-align:left;border:2px solid transparent;position:relative;flex:0 0 138px;scroll-snap-align:start;transition:transform .15s,border-color .15s}
.grid .card{flex:auto}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--ac);background:var(--s2)}
.card[disabled]{opacity:.45;cursor:not-allowed}
.art{height:74px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 55) 70% 28%))}
.art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.1) 0 6px,transparent 6px 14px)}
.art:after{content:"";position:absolute;inset:10px 8px;background:linear-gradient(100deg,hsl(var(--h) 25% 90%),hsl(var(--h) 85% 62%) 38%,hsl(var(--h) 75% 32%));clip-path:polygon(4% 62%,64% 30%,96% 38%,96% 56%,34% 78%,10% 74%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.art{background:radial-gradient(circle at 50% 40%,hsl(var(--h) 60% 38%),hsl(var(--h) 55% 12%))}
.art.w0:after{clip-path:polygon(0 46%,14% 38%,40% 36%,58% 36%,62% 26%,72% 26%,72% 36%,100% 34%,100% 44%,74% 46%,70% 64%,64% 100%,52% 100%,55% 64%,42% 62%,36% 86%,24% 86%,28% 58%,12% 62%,0 60%)}
.art.w1:after{clip-path:polygon(0 50%,10% 40%,34% 38%,56% 38%,60% 30%,68% 30%,68% 38%,100% 38%,100% 44%,70% 47%,66% 60%,60% 96%,50% 96%,52% 60%,40% 60%,32% 82%,22% 82%,26% 58%,8% 64%,0 60%)}
.art.w2:after{clip-path:polygon(0 46%,10% 40%,34% 40%,40% 26%,56% 26%,60% 40%,100% 40%,100% 46%,62% 48%,58% 62%,54% 96%,44% 96%,46% 62%,36% 60%,28% 80%,18% 80%,22% 58%,8% 62%,0 58%)}
.art.w3:after{clip-path:polygon(18% 28%,86% 28%,92% 36%,92% 46%,56% 46%,50% 52%,50% 100%,32% 100%,34% 52%,26% 46%,18% 46%)}
.art.w4:after{clip-path:polygon(0 52%,14% 42%,46% 42%,58% 40%,100% 40%,100% 48%,60% 52%,44% 60%,40% 62%,34% 84%,22% 84%,26% 60%,8% 66%,0 62%)}
.art.w5:after{clip-path:polygon(12% 40%,40% 36%,62% 36%,66% 30%,74% 30%,74% 38%,96% 38%,96% 48%,76% 50%,72% 66%,66% 100%,54% 100%,56% 66%,44% 62%,38% 84%,26% 84%,30% 58%,14% 60%)}
.art.w6:after{clip-path:polygon(2% 50%,60% 14%,96% 12%,80% 34%,62% 44%,34% 56%,26% 76%,14% 86%,8% 74%,14% 62%)}
.art.w7:after{clip-path:polygon(22% 90%,18% 54%,10% 40%,18% 34%,26% 46%,28% 22%,36% 20%,40% 42%,44% 14%,52% 14%,52% 42%,58% 20%,66% 22%,62% 48%,72% 38%,80% 44%,70% 64%,74% 90%)}
.art.cr:before{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 12px)}
.art.cr:after{inset:14px 24%;clip-path:none;border-radius:8px;border:2px solid rgba(255,255,255,.55);background:linear-gradient(180deg,hsl(var(--h) 70% 55%) 0 30%,hsl(var(--h) 60% 28%) 30%);box-shadow:0 0 22px hsl(var(--h) 90% 60%/.55)}
.nm{font-weight:800;font-size:13px;margin:8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:12px;color:var(--mu);margin:0 2px 2px}
.pr i{font-style:normal;color:var(--gold)}
.tag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:2px 8px;z-index:1}
.rar{height:3px;border-radius:3px;margin:6px 2px 0}
.c0{background:var(--r0)}.c1{background:var(--r1)}.c2{background:var(--r2)}.c3{background:var(--r3)}.c4{background:var(--r4)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--s1);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px}
.chip.x{color:var(--lose)}
.stake{background:var(--s1);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:10px}
.go{width:100%;margin-top:18px;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--ac),#ff5fc0);color:#fff;font:700 16px Unbounded,system-ui,sans-serif;transition:transform .15s,opacity .2s}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.4;cursor:not-allowed;background:var(--s2);color:var(--mu)}
.hint{text-align:center;color:var(--mu);font-size:13px;margin:10px 0 0;min-height:18px}
.res{margin-top:14px;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;animation:pop .35s}
.res .art{width:96px;flex:none}
.res.win{background:color-mix(in srgb,var(--win) 16%,var(--s1))}.res.lose{background:color-mix(in srgb,var(--lose) 14%,var(--s1))}
.res h3{margin:0;font:700 16px Unbounded,system-ui,sans-serif}
.res p{margin:4px 0 0;color:var(--mu);font-size:13px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.btn{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:var(--s2);font-weight:800;font-size:12px}
.btn.buy{background:var(--ac);color:#fff}
.empty{background:var(--s1);border-radius:16px;padding:22px;text-align:center;color:var(--mu)}
.empty button{margin-top:12px;background:var(--ac);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800}
.reset{display:block;margin:28px auto 0;background:none;color:var(--mu);text-decoration:underline;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;transition:.25s;z-index:9;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.stk{position:absolute;left:6px;bottom:4px;font-size:13px;z-index:1;background:rgba(0,0,0,.45);border-radius:99px;padding:0 5px}
.sa:after,.sa:before{display:none}
.roul{position:relative;overflow:hidden;background:var(--s1);border-radius:18px;padding:10px}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);z-index:2;box-shadow:0 0 12px var(--gold)}
.strip{display:flex;gap:8px;will-change:transform}
.cell{flex:0 0 112px;background:var(--s2);border-radius:12px;padding:6px}
.cell .art{height:56px}
.srch{width:100%;background:var(--s1);color:var(--tx);border:2px solid var(--s2);border-radius:14px;padding:12px 14px;font:inherit;margin-bottom:12px}
.srch:focus{outline:none;border-color:var(--ac)}
nav button{font-size:13px;padding:12px 4px}
.me{display:flex;gap:10px;align-items:center;background:none;font:700 15px Unbounded,system-ui,sans-serif;max-width:55%;padding:0;color:var(--tx)}
.me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:hsl(var(--h) 65% 45%);font-size:22px;box-shadow:0 0 0 2px var(--s2)}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:52px;margin:0 auto 10px}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
.eb{background:var(--s1);border-radius:14px;padding:10px 0;font-size:24px;border:2px solid transparent}
.eb.sel{border-color:var(--ac);background:var(--s2)}
.rg{width:100%;accent-color:var(--ac);margin-bottom:20px}
.art.ph{background:var(--im) center/cover no-repeat}.art.ph:before,.art.ph:after{display:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.slot{background:var(--s1);border-radius:14px;padding:6px;font-size:12px;font-weight:800;text-align:center;cursor:pointer}
.slot .art{height:52px;margin-bottom:4px}.slot span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff}
header{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 88%,transparent)}
nav{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 90%,transparent)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 4px}
.ni{font-size:19px;line-height:1}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.sum>div:not(.ar){flex:1;min-width:0}.sum>div:last-child{text-align:right}
.sum b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum small{display:block;color:var(--mu);font-size:12px}
.sum .ar{color:var(--ac);font-size:20px;font-weight:800}
.go{box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 35%,transparent)}
.go[disabled]{box-shadow:none}
.sec h2{font-size:14px;color:var(--tx);opacity:.75}
.chip{min-height:38px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><button class="me" id="me" onclick="go('pf')" aria-label="Профиль"></button><div class="bal" id="bal"><i>◈</i><span id="balv">0</span></div></header>
  <div class="chips" id="dev" style="margin:0 0 12px"></div>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
window.onerror=function(m,u,l){var e=document.getElementById("main");if(e)e.innerHTML='<div class="empty">Ошибка: '+m+' (строка '+l+')</div>'};
const SK=[["Неоновый Шторм",50,300],["Пыльная Дюна",120,38],["Ледяной Шёпот",250,195],["Медный Закат",400,20],["Тихий Омут",700,215],["Изумрудный Клык",1100,150],["Ночной Рейс",1800,250],["Багровый Орден",2800,350],["Лунная Пыль",4200,265],["Золотая Лихорадка",6500,45],["Призрак Вулкана",10000,8],["Королевский Кобальт",16000,225],["Абсолютный Ноль",30000,180]].map((a,i)=>({id:i,n:a[0],p:a[1],h:a[2]}));
const KEY="upgrader-v1",EDGE=.95;
let st={bal:1000,inv:[],uid:1,fresh:1};
try{const s=localStorage.getItem(KEY);if(s)st=JSON.parse(s)}catch(e){}
if(!st||typeof st.bal!=="number"||!Array.isArray(st.inv))st={bal:1000,inv:[],uid:1,fresh:1};st.uid=st.uid||(st.inv.length+1)+100;st.stk=st.stk||[];st.pf=st.pf||{n:"Игрок",e:"🦊",c:260,img:""};st.im=st.im||{};st.inv=st.inv.filter(i=>i&&i.id<999);st.inv.forEach(i=>i.s=i.s||[]);
let tab="up",sel=new Set(),extra=0,target=null,R=0,busy=false,res=null,hint="";
const fmt=n=>Math.round(n).toLocaleString("ru-RU");
const rar=p=>p<300?"c0":p<1500?"c1":p<5000?"c2":p<12000?"c3":"c4";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function bump(){const b=document.getElementById("bal");b.classList.add("bump");setTimeout(()=>b.classList.remove("bump"),250)}
function card(s,o={}){return `<button class="card ${o.sel?"sel":""}" ${o.dis?"disabled":""} ${o.click?`onclick="${o.click}"`:""}>
<div ${ia("w"+s.t,s.h,"art w"+s.t)}>${o.tag?`<span class="tag">${o.tag}</span>`:""}${s.st&&s.st.length?`<span class="stk">${s.st.map(k=>STK[k].e).join("")}</span>`:""}</div>
<div class="nm">${s.n}</div><div class="pr"><i>◈</i> ${fmt(s.p)}</div><div class="rar ${rar(s.p)}"></div>${o.extra||""}</button>`}
function stakeVal(){let v=extra;sel.forEach(u=>{const it=st.inv.find(i=>i.uid===u);if(it)v+=itemVal(it)});return v}
function chance(){const s=stakeVal();if(!target&&target!==0||!s)return 0;return Math.min(.9,s/SK[target].p*EDGE)}
function check(){const s=stakeVal();if(!s)return"Выбери скины или добавь монеты в ставку";if(target===null)return"Выбери скин, который хочешь получить";if(SK[target].p<=s)return"Выбери скин дороже ставки";if(chance()<.0001)return"Шанс ниже 0.01% — увеличь ставку";return""}
function vUp(){
  const p=chance(),C=2*Math.PI*86,err=check();
  const stakeCards=st.inv.length?`<div class="row">${st.inv.slice().sort((a,b)=>itemVal(b)-itemVal(a)).map(i=>card(iv(i),{sel:sel.has(i.uid),click:`tog(${i.uid})`,tag:sel.has(i.uid)?"✓":""})).join("")}</div>`:`<div class="empty">В инвентаре пусто. Купи скин в магазине или сделай ставку монетами.</div>`;
  const tg=tgList().map(s=>card(s,{sel:target===s.id,click:`pick(${s.id})`,tag:stakeVal()?pct(Math.min(.9,stakeVal()/s.p*EDGE)):""})).join("");
  const r=res?`<div class="res ${res.win?"win":"lose"}">${res.win?`<div ${ia("w"+SK[res.id].t,SK[res.id].h,"art w"+SK[res.id].t)}></div><div><h3>Победа!</h3><p>${SK[res.id].n} теперь в инвентаре</p></div>`:`<div><h3>Не повезло</h3><p>Ставка сгорела. Попробуй ещё раз — шанс всегда есть.</p></div>`}</div>`:"";
  return `<button class="go" id="gob" onclick="spin()" style="margin-top:0" ${err||busy?"disabled":""}>Апгрейд</button><div class="hint" style="margin-bottom:6px">${busy?"Крутим…":err}</div><div class="sum"><div><small>Ставка</small><b>◈ ${fmt(stakeVal())}</b></div><div class="ar">→</div><div><small>Цель</small><b>${target!==null?esc(SK[target].n):"не выбрана"}</b><small>${target!==null?"◈ "+fmt(SK[target].p):"выбери ниже"}</small></div></div><div class="wheelBox" id="wb"><svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="86"/><circle class="arc" cx="100" cy="100" r="86" transform="rotate(-90 100 100)" stroke-dasharray="${Math.max(p*C,p>0?.6:0).toFixed(2)} ${C.toFixed(1)}"/><g class="needle" id="nd" style="transform:rotate(${R}deg)"><path d="M92 2h16l-8 21z"/></g></svg>
  <div class="mid"><b>${pct(p)}</b><span>шанс победы</span></div></div>${r}
  <div class="sec"><h2>Ставка</h2><div class="stake"><span>Сумма ставки</span><b><span style="color:var(--gold)">◈</span> ${fmt(stakeVal())}</b></div>
  <div class="chips">${[1,10,100,500,1000,5000].map(v=>`<button class="chip" onclick="addX(${v})">+${fmt(v)}</button>`).join("")}<button class="chip" onclick="addX(st.inf?7e6:st.bal)">Всё</button><button class="chip" onclick="selAll()">Все скины</button><button class="chip x" onclick="clr()">Сбросить</button></div></div>
  <div class="sec"><h2>Твои скины в ставку</h2>${stakeCards}</div>
  <div class="sec"><h2>Что хочешь получить · быстрый шанс</h2><div class="chips" style="margin-bottom:10px">${[.01,1,10,25,35,50,55,75].map(x=>`<button class="chip" onclick="setCh(${x})">${x}%</button>`).join("")}</div>${tg?`<div class="row">${tg}</div>`:`<div class="empty">Нет скинов дороже такой ставки</div>`}</div>
  `}
function go(t){if(busy)return;tab=t;render();scrollTo(0,0)}
function tog(u){if(busy)return;sel.has(u)?sel.delete(u):sel.add(u);fix();render()}
function pick(i){if(busy)return;target=target===i?null:i;render()}
function addX(v){if(busy)return;extra=Math.min(st.bal,extra+v);fix();render()}
function clr(){if(busy)return;sel.clear();extra=0;render()}
function fix(){if(target!==null&&SK[target].p<=stakeVal())target=null;res=null}
function buy(id){const s=SK[id];if(st.bal<s.p)return;st.bal-=s.p;st.inv.push({uid:st.uid++,id,s:[]});save();render();bump();toast("Куплено: "+s.n)}
let rc=0;function resetAll(){if(!rc){rc=1;toast("Нажми ещё раз, чтобы сбросить всё");setTimeout(()=>rc=0,3000);return}rc=0;st={bal:1000,inv:[],uid:1,stk:[],pf:st.pf,im:st.im,fresh:1};giveStart();sel.clear();extra=0;target=null;res=null;save();render()}
function spin(){
  if(busy||check())return;
  const p=chance(),tid=target;busy=true;res=null;
  st.bal-=extra;st.inv=st.inv.filter(i=>!sel.has(i.uid));
  const u=st.win?Math.random()*p:Math.random(),win=u<p;
  document.getElementById("balv").textContent=bt();
  const nd=document.getElementById("nd"),gb=document.getElementById("gob");
  gb.disabled=true;document.querySelector(".hint").textContent="Крутим…";
  const cur=R%360,delta=((u*360-cur)+360)%360,nr=R+1800+delta;
  nd.getBoundingClientRect();
  nd.style.transition="transform 4.6s cubic-bezier(.1,.75,.08,1)";nd.style.transform=`rotate(${nr}deg)`;
  setTimeout(()=>{
    R=nr%360;busy=false;sel.clear();extra=0;
    if(win){st.inv.push({uid:st.uid++,id:tid,s:[]});target=null}
    res={win,id:tid};save();render();bump();
    const wb=document.getElementById("wb");wb.classList.add(win?"win":"lose");
    toast(win?"Победа! +"+SK[tid].n:"Не повезло");try{navigator.vibrate&&navigator.vibrate(win?[60,40,60]:120)}catch(e){}
  },4700);
}

(()=>{const T=["Автомат","Винтовка","Снайперка","Пистолет","Дробовик","ПП","Клинок","Перчатки"],W=["Янтарь","Вьюга","Орхидея","Базальт","Сирена","Кварц","Мираж","Бархат","Тайфун","Лаванда","Обсидиан","Рассвет","Мангуст","Нефрит","Сумерки","Пепел","Колибри","Гранат","Прибой","Стрела","Оазис","Гроза","Шёлк","Метеор","Тундра"];let x=7;const r=()=>(x=x*16807%2147483647)/2147483647;
for(const t of T)for(const w of W){let p=20*Math.pow(1500,r())*(t==="Клинок"||t==="Перчатки"?2:1);p=p<100?Math.round(p/5)*5:Math.round(p/10)*10;SK.push({id:SK.length,n:w+" · "+t,p,h:Math.floor(r()*360),t:T.indexOf(t)})}})();
const STARTERS=[0];
(()=>{const T=["Автомат","Винтовка","Снайперка","Пистолет","Дробовик","ПП","Клинок","Перчатки"],W=["Император","Феникс","Левиафан","Аврора","Зодиак","Сапфир","Громовержец","Нирвана","Кардинал","Эклипс","Оникс","Валькирия","Сфинкс","Титан","Хроно"];let x=13;const r=()=>(x=x*16807%2147483647)/2147483647;
for(let i=0;i<T.length;i++)for(const w of W){let p=30000*Math.pow(7e6/3e4,r())*(i>5?1.5:1);p=Math.min(p,6.9e6);const d=Math.pow(10,Math.floor(Math.log10(p))-1);p=Math.round(p/d)*d;SK.push({id:SK.length,n:w+" · "+T[i],p,h:Math.floor(r()*360),t:i})}
SK.push({id:SK.length,n:"Корона Мира · Клинок",p:7e6,h:48,t:6});
for(const [n,t] of [["Новичок · Пистолет",3],["Новичок · ПП",5]]){STARTERS.push(SK.length);SK.push({id:SK.length,n,p:50,h:n.length*40%360,t})}})();
const STK=[["🔥","Огонь",40],["💎","Алмаз",300],["👑","Корона",1200],["🎯","Мишень",60],["🐺","Волк",150],["⚡","Молния",90],["🦄","Единорог",800],["💀","Череп",220],["🍀","Клевер",35],["🚀","Ракета",500],["🌙","Луна",120],["🧊","Лёд",70],["🐉","Дракон",2500],["⭐","Звезда",180],["🎲","Кости",45],["🦅","Орёл",350],["🌋","Вулкан",650],["🪐","Планета",1600],["🍄","Гриб",30],["🕶️","Очки",110],["🧿","Талисман",420],["🏆","Кубок",3000]].map((a,i)=>({id:i,e:a[0],n:a[1],p:a[2]}));
SK.forEach((k,i)=>{if(k.t===undefined)k.t=i%8});
const RK=[...SK].sort((a,b)=>a.p-b.p);
const hu=(a,b)=>RK.filter(s=>a<=b?s.h>=a&&s.h<=b:(s.h>=a||s.h<=b));
const ty=t=>RK.filter(s=>s.t===t);
const CB=[["Рассвет",20,RK.slice(0,60),1],["Тайга",150,RK.slice(30,100),1],["Мираж",280,RK.slice(70,140),1],["Бархат",320,RK.slice(110,170),1],["Метеор",45,RK.slice(150,213),1],["Арсенал",200,RK.filter(s=>s.t<2),1],["Снайперы",160,ty(2),1],["Пистолеты",30,ty(3),1],["Дробь",10,ty(4),1],["Спринт",250,ty(5),1],["Клинки",340,ty(6),1],["Перчатки",300,ty(7),1],["Все подряд",120,RK,1],["Рискованный",0,RK,2],["Золотой",48,RK.slice(-40),1],["Копилка",90,RK.slice(0,40),1],["Багровый",355,hu(340,20),1],["Ледяной",195,hu(170,250),1],["Лесной",120,hu(80,160),1],["Безопасный",230,RK.slice(60,160),.5]].map(a=>{const pool=a[2],e=a[3],ws=pool.map(s=>Math.pow(s.p,-e)),W=ws.reduce((x,y)=>x+y,0),ev=pool.reduce((x,s,i)=>x+s.p*ws[i],0)/W;return{n:"Кейс «"+a[0]+"»",pool,ws,W,h:a[1],price:Math.max(10,Math.round(ev*1.12/10)*10)}});
let cs=null,drop=null,ss=null,q="",lim=24;
const itemVal=i=>SK[i.id].p+Math.round(.5*(i.s||[]).reduce((a,k)=>a+STK[k].p,0));
const iv=i=>({...SK[i.id],p:itemVal(i),st:i.s||[]});
const tgList=()=>{const v=stakeVal();return v?RK.filter(s=>s.p>v&&v/s.p*EDGE>=.0001):RK.slice(0,40)};
const pct=p=>{const x=p*100;return(x>=10?x.toFixed(0):x>=1?x.toFixed(1):x.toFixed(2))+"%"};
function navR(){if(st.inf&&st.bal<1e11)st.bal=1e12;document.getElementById("balv").textContent=bt();document.getElementById("dev").innerHTML=`<button class="chip ${st.inf?"on":""}" onclick="togInf()">♾ Бесконечный баланс</button><button class="chip ${st.win?"on":""}" onclick="togWin()">🎯 Все апгрейды выигрышные</button>`;document.getElementById("me").innerHTML=av(st.pf)+"<b>"+esc(nick())+"</b>";const pv=document.getElementById("pv");if(pv)pv.innerHTML=pvH();document.getElementById("nav").innerHTML=[["up","⚡","Апгрейд"],["case","📦","Кейсы"],["shop","🛒","Магазин"],["inv","🎒","Скины "+st.inv.length]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span class="ni">${i}</span>${l}</button>`).join("")}
function render(){navR();document.getElementById("main").innerHTML=tab==="up"?vUp():tab==="pf"?vPf():tab==="case"?vCase():tab==="shop"?vShop():vInv()}
const stkCard=(k,x,c)=>{const s=STK[k];return `<button class="card ${ss===x?"sel":""}" style="flex:0 0 96px" onclick="${c}"><div class="art sa${st.im["s"+k]?" ph":""}" style="--h:${k*37%360};height:56px;display:grid;place-items:center;font-size:30px${st.im["s"+k]?`;--im:url(${st.im["s"+k]})`:""}"><span style="position:relative;z-index:1">${st.im["s"+k]?"":s.e}</span></div><div class="nm">${s.n}</div><div class="pr"><i>◈</i> ${fmt(s.p)}</div><div class="rar ${rar(s.p)}"></div></button>`};
function shopGrid(){const l=SK.filter(s=>s.n.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.p-b.p);return `<div class="grid">${l.slice(0,lim).map(s=>card(s,{extra:`<button class="btn buy" ${st.bal<s.p?"disabled":""} onclick="buy(${s.id})">Купить</button>`})).join("")}</div>${l.length>lim?`<button class="btn" style="padding:12px" onclick="lim+=24;document.getElementById('sg').innerHTML=shopGrid()">Показать ещё</button>`:l.length?"":`<div class="empty">Ничего не найдено</div>`}`}
function vShop(){return `<div class="sec"><h2>Наклейки · нажми, чтобы купить</h2><div class="row">${STK.map(s=>stkCard(s.id,-1,`buyS(${s.id})`)).join("")}</div></div><div class="sec"><h2>Скины · ${SK.length}</h2><input class="srch" placeholder="Поиск по названию" value="${q.replace(/"/g,"&quot;")}" oninput="q=this.value;lim=24;document.getElementById('sg').innerHTML=shopGrid()"><div id="sg">${shopGrid()}</div></div>`}
function vInv(){
  const stk=st.stk.length?`<div class="row">${st.stk.map((k,x)=>stkCard(k,x,`selS(${x})`)).join("")}</div>`:`<div class="empty">Наклеек нет. Купи их в магазине.</div>`;
  const sk=st.inv.length?`<div class="grid">${st.inv.map(i=>card(iv(i),{extra:(ss!==null?`<button class="btn buy" ${i.s.length>=4?"disabled":""} onclick="stick(${i.uid})">Наклеить ${STK[st.stk[ss]].e}</button>`:"")+`<button class="btn" onclick="sell(${i.uid})">Продать за ${fmt(itemVal(i))}</button>`})).join("")}</div>`:`<div class="empty">Пока пусто<br><button onclick="go('case')">Открыть кейс</button></div>`;
  return `<div class="sec"><h2>Наклейки · выбери и наклей на скин, до 4 штук</h2>${stk}</div><div class="sec"><h2>Скины</h2>${sk}</div><button class="reset" onclick="resetAll()">Начать заново с 1 000</button>`}
function selS(x){ss=ss===x?null:x;render()}
function stick(u){const it=st.inv.find(i=>i.uid===u);if(!it||ss===null||it.s.length>=4)return;it.s.push(st.stk[ss]);st.stk.splice(ss,1);ss=null;save();render();toast("Наклейка добавлена, цена выросла")}
function buyS(k){const s=STK[k];if(st.bal<s.p){toast("Не хватает монет");return}st.bal-=s.p;st.stk.push(k);save();render();bump();toast("Куплено: "+s.n)}
function sell(u){const k=st.inv.findIndex(i=>i.uid===u);if(k<0)return;const v=itemVal(st.inv[k]);st.inv.splice(k,1);st.bal+=v;sel.delete(u);if(drop&&drop.uid===u)drop=null;save();render();bump();toast("Продано за ◈ "+fmt(v))}
const pickFrom=c=>{let r=Math.random()*c.W;for(let i=0;i<c.pool.length;i++){r-=c.ws[i];if(r<=0)return c.pool[i]}return c.pool[0]};
const cellH=s=>`<div class="cell"><div ${ia("w"+s.t,s.h,"art w"+s.t)}></div><div class="nm">${s.n}</div><div class="rar ${rar(s.p)}"></div></div>`;
const resC=()=>drop?`<div class="res win"><div ${ia("w"+drop.s.t,drop.s.h,"art w"+drop.s.t)}></div><div><h3>${drop.s.n}</h3><p>Стоимость ◈ ${fmt(drop.s.p)}</p><button class="btn" onclick="sell(${drop.uid})">Продать за ${fmt(drop.s.p)}</button></div></div>`:"";
function vCase(){
  if(cs===null)return `<div class="sec"><h2>Кейсы</h2><div class="grid">${CB.map((c,i)=>`<button class="card" onclick="cs=${i};drop=null;render()"><div ${ia("c"+i,c.h,"art cr")}></div><div class="nm">${c.n}</div><div class="pr"><i>◈</i> ${fmt(c.price)} · ${c.pool.length} предм.</div></button>`).join("")}</div></div>`;
  const c=CB[cs];
  return `<div class="sec"><button class="chip" onclick="if(!busy){cs=null;render()}">‹ Все кейсы</button><h2 style="margin-top:14px">${c.n}</h2><div class="roul" id="rl"><div class="mk"></div><div class="strip" id="strip">${Array.from({length:12},()=>cellH(pickFrom(c))).join("")}</div></div><div id="cres">${resC()}</div><button class="go" onclick="openCase()" ${busy?"disabled":""}>Открыть за ◈ ${fmt(c.price)}</button></div><div class="sec"><h2>Что может выпасть · показано ${Math.min(40,c.pool.length)} из ${c.pool.length}</h2><div class="grid">${c.pool.map((s,i)=>[s,c.ws[i]/c.W]).reverse().slice(0,40).map(([s,w])=>card(s,{tag:(w*100).toFixed(w<.001?2:1)+"%"})).join("")}</div></div>`}
function openCase(){
  const c=CB[cs];if(busy)return;if(st.bal<c.price){toast("Не хватает монет");return}
  busy=true;drop=null;st.bal-=c.price;navR();document.getElementById("cres").innerHTML="";document.querySelector(".go").disabled=true;
  const win=pickFrom(c),WI=40,strip=document.getElementById("strip"),rl=document.getElementById("rl");
  strip.innerHTML=Array.from({length:46},(_,i)=>cellH(i===WI?win:pickFrom(c))).join("");
  strip.style.transition="none";strip.style.transform="translateX(0)";strip.getBoundingClientRect();
  const off=WI*120+56-rl.clientWidth/2+(Math.random()*60-30);
  strip.style.transition="transform 5s cubic-bezier(.08,.7,.1,1)";strip.style.transform=`translateX(${-off}px)`;
  setTimeout(()=>{busy=false;const uid=st.uid++;st.inv.push({uid,id:win.id,s:[]});drop={s:win,uid};save();navR();bump();document.getElementById("cres").innerHTML=resC();document.querySelector(".go").disabled=false;toast("Выпало: "+win.n)},5100)}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nick=()=>(st.pf.n||"").trim()||"Игрок";
const av=(p,c)=>`<span class="av ${c||""}" style="--h:${p.c}">${p.img?`<img alt="" src="${p.img}">`:p.e}</span>`;
const pvH=()=>av(st.pf,"big")+`<div class="nm" style="font-size:18px;text-align:center">${esc(nick())}</div>`;
const EM=["🦊","🐼","🐯","🦁","🐸","🐙","🦄","🐲","🦉","🐺","🐧","🐨","🤖","👾","👽","💀","🔥","⚡","🌙","⭐","🎯","👑","💎","🚀"];
function vPf(){const p=st.pf;return `<div class="sec"><div id="pv">${pvH()}</div>
<h2>Никнейм</h2><input class="srch" maxlength="16" placeholder="Твой ник" value="${esc(p.n)}" oninput="setNick(this.value)" style="margin-bottom:20px">
<h2>Иконка</h2><div class="avg">${EM.map(e=>`<button class="eb ${p.e===e&&!p.img?"sel":""}" onclick="setEm('${e}')">${e}</button>`).join("")}</div>
<h2>Цвет фона</h2><input type="range" class="rg" min="0" max="359" value="${p.c}" oninput="setHue(this.value)">
<h2>Своё фото</h2><div class="chips"><label class="chip" for="upf">Загрузить фото</label><input type="file" id="upf" accept="image/*" hidden onchange="upImg(this)">${p.img?`<button class="chip x" onclick="rmImg()">Убрать фото</button>`:""}</div>
<h2 style="margin-top:20px">Свои картинки для предметов</h2><p class="hint" style="text-align:left;margin:0 0 12px">Нажми на плитку и выбери своё фото. Оно заменит рисунок у всех предметов этого типа.</p>${slots("Оружие",TN.map((n,i)=>["w"+i,n,"art w"+i,i*45]))}${slots("Кейсы",CB.map((c,i)=>["c"+i,c.n.replace("Кейс ",""),"art cr",c.h]))}${slots("Наклейки",STK.map(k=>["s"+k.id,k.n,"art sa",k.id*37%360]))}${Object.keys(st.im).length?`<button class="chip x" onclick="st.im={};save();render()">Вернуть все рисунки</button>`:""}<button class="go" onclick="go('up')">Готово</button></div>`}
function setNick(v){st.pf.n=String(v).slice(0,16);save();navR()}
function setEm(e){st.pf.e=e;st.pf.img="";save();render()}
function setHue(v){st.pf.c=+v;save();navR()}
function rmImg(){st.pf.img="";save();render()}
function upImg(inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>10e6){toast("Файл слишком большой");return}
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=128;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);st.pf.img=c.toDataURL("image/jpeg",.85);save();render();toast("Фото установлено")}catch(e){toast("Не удалось загрузить фото")}};im.onerror=()=>toast("Это не картинка");im.src=rd.result};rd.readAsDataURL(f)}

const TN=["Автомат","Винтовка","Снайперка","Пистолет","Дробовик","ПП","Клинок","Перчатки"];
const ia=(k,h,c)=>{const m=st.im[k];return `class="${c}${m?" ph":""}" style="--h:${h}${m?`;--im:url(${m})`:""}"`};
const slots=(t,a)=>`<h2>${t}</h2><div class="slots">${a.map(([k,n,c,h])=>`<label class="slot"><div ${ia(k,h,c)}></div><span>${esc(n)}</span><input type="file" accept="image/*" hidden onchange="upIm('${k}',this)"></label>`).join("")}</div>`;
function upIm(k,inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>10e6){toast("Файл слишком большой");return}
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=256;c.height=144;const r=Math.max(256/im.width,144/im.height),w=im.width*r,h=im.height*r;c.getContext("2d").drawImage(im,(256-w)/2,(144-h)/2,w,h);st.im[k]=c.toDataURL("image/jpeg",.8);save();render();toast("Картинка установлена")}catch(e){toast("Не удалось загрузить")}};im.onerror=()=>toast("Это не картинка");im.src=rd.result};rd.readAsDataURL(f)}

function setCh(x){if(busy)return;const v=stakeVal();if(!v){toast("Сначала добавь ставку");return}
  const c=tgList();if(!c.length){toast("Нет подходящих скинов");return}
  let b=c[0],bd=1e9;for(const s of c){const ch=Math.min(.9,v/s.p*EDGE)*100,d=Math.abs(Math.log(ch/x));if(d<bd){bd=d;b=s}}
  target=b.id;res=null;render();toast("Шанс "+pct(chance()));const e=document.querySelector(".card.sel[onclick^='pick']");if(e)e.scrollIntoView({inline:"center",block:"nearest"})}

function giveStart(){if(st.fresh){STARTERS.forEach(id=>st.inv.push({uid:st.uid++,id,s:[]}));delete st.fresh;save()}}
giveStart();

const bt=()=>st.inf?"∞":fmt(st.bal);
function togInf(){if(busy)return;if(st.inf){st.inf=0;st.bal=st.balBak||1000}else{st.inf=1;st.balBak=st.bal;st.bal=1e12}save();render();toast(st.inf?"Баланс бесконечный":"Обычный баланс")}
function togWin(){st.win=st.win?0:1;save();render();toast(st.win?"Все апгрейды выигрышные":"Обычные шансы")}

function selAll(){if(busy)return;st.inv.forEach(i=>sel.add(i.uid));fix();render()}
render();
</script>
</body>
