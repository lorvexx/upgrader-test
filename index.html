<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON DROP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040806;--s1:#0b140f;--s2:#122019;--tx:#e6fff1;--mu:#7aa28d;--ac:#19ff8c;--win:#19ff8c;--lose:#ff4d6d;--gold:#d8ff3d;--r0:#86a597;--r1:#3fa9ff;--r2:#a97bff;--r3:#ff4fd0;--r4:#ffd23f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Manrope,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:var(--bg)}
h1{font:700 18px Unbounded,system-ui,sans-serif;margin:0}
.bal{background:var(--s1);border-radius:99px;padding:8px 16px;font:700 15px Unbounded,system-ui,sans-serif;display:flex;gap:8px;align-items:center;transition:transform .25s}
.bal i{font-style:normal;color:var(--gold)}
.bal.bump{transform:scale(1.08)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
nav button{flex:1;max-width:180px;padding:12px;border-radius:14px;background:var(--s1);color:var(--mu);font-weight:800}
nav button.on{background:var(--ac);color:#fff}
.wheelBox{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:8px auto 4px}
.wheelBox svg{width:100%;height:100%;overflow:visible}
.trk{fill:none;stroke:var(--s2);stroke-width:12}
.arc{fill:none;stroke:var(--win);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .5s}
.needle{fill:var(--tx);transform-origin:100px 100px}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.mid b{font:700 40px Unbounded,system-ui,sans-serif}
.mid span{color:var(--mu);font-size:13px}
.wheelBox.win{animation:glowW 1s}.wheelBox.lose{animation:glowL .6s}
@keyframes glowW{0%,100%{filter:none}40%{filter:drop-shadow(0 0 22px var(--win))}}
@keyframes glowL{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sec{margin-top:20px}
.sec h2{font:700 13px Unbounded,system-ui,sans-serif;margin:0 0 10px;color:var(--mu)}
.row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--s1);border-radius:16px;padding:8px;text-align:left;border:2px solid transparent;position:relative;flex:0 0 138px;scroll-snap-align:start;transition:transform .15s,border-color .15s}
.grid .card{flex:auto}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--ac);background:var(--s2)}
.card[disabled]{opacity:.45;cursor:not-allowed}
.art{height:74px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 55) 70% 28%))}
.art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.1) 0 6px,transparent 6px 14px)}
.art:after{content:"";position:absolute;inset:10px 8px;background:linear-gradient(100deg,hsl(var(--h) 25% 90%),hsl(var(--h) 85% 62%) 38%,hsl(var(--h) 75% 32%));clip-path:polygon(4% 62%,64% 30%,96% 38%,96% 56%,34% 78%,10% 74%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.art{background:radial-gradient(circle at 50% 40%,hsl(var(--h) 60% 38%),hsl(var(--h) 55% 12%))}
.art.w0:after{clip-path:polygon(0 46%,14% 38%,40% 36%,58% 36%,62% 26%,72% 26%,72% 36%,100% 34%,100% 44%,74% 46%,70% 64%,64% 100%,52% 100%,55% 64%,42% 62%,36% 86%,24% 86%,28% 58%,12% 62%,0 60%)}
.art.w1:after{clip-path:polygon(0 50%,10% 40%,34% 38%,56% 38%,60% 30%,68% 30%,68% 38%,100% 38%,100% 44%,70% 47%,66% 60%,60% 96%,50% 96%,52% 60%,40% 60%,32% 82%,22% 82%,26% 58%,8% 64%,0 60%)}
.art.w2:after{clip-path:polygon(0 46%,10% 40%,34% 40%,40% 26%,56% 26%,60% 40%,100% 40%,100% 46%,62% 48%,58% 62%,54% 96%,44% 96%,46% 62%,36% 60%,28% 80%,18% 80%,22% 58%,8% 62%,0 58%)}
.art.w3:after{clip-path:polygon(18% 28%,86% 28%,92% 36%,92% 46%,56% 46%,50% 52%,50% 100%,32% 100%,34% 52%,26% 46%,18% 46%)}
.art.w4:after{clip-path:polygon(0 52%,14% 42%,46% 42%,58% 40%,100% 40%,100% 48%,60% 52%,44% 60%,40% 62%,34% 84%,22% 84%,26% 60%,8% 66%,0 62%)}
.art.w5:after{clip-path:polygon(12% 40%,40% 36%,62% 36%,66% 30%,74% 30%,74% 38%,96% 38%,96% 48%,76% 50%,72% 66%,66% 100%,54% 100%,56% 66%,44% 62%,38% 84%,26% 84%,30% 58%,14% 60%)}
.art.w6:after{clip-path:polygon(2% 50%,60% 14%,96% 12%,80% 34%,62% 44%,34% 56%,26% 76%,14% 86%,8% 74%,14% 62%)}
.art.w7:after{clip-path:polygon(22% 90%,18% 54%,10% 40%,18% 34%,26% 46%,28% 22%,36% 20%,40% 42%,44% 14%,52% 14%,52% 42%,58% 20%,66% 22%,62% 48%,72% 38%,80% 44%,70% 64%,74% 90%)}
.art.w8:after{clip-path:polygon(12% 80%,16% 62%,30% 40%,52% 24%,78% 20%,92% 30%,80% 34%,60% 40%,44% 54%,34% 74%,24% 90%,16% 90%)}
.art.w9:after{clip-path:polygon(6% 74%,14% 64%,50% 40%,92% 20%,96% 26%,60% 52%,30% 72%,18% 86%)}
.art.w10:after{clip-path:polygon(4% 56%,26% 52%,34% 40%,92% 34%,96% 42%,40% 62%,26% 64%,4% 66%)}
.art.w11:after{clip-path:polygon(4% 60%,28% 54%,30% 38%,35% 38%,35% 54%,96% 46%,96% 54%,35% 66%,30% 72%,28% 66%,4% 70%)}
.art.w12:after{clip-path:polygon(4% 58%,26% 56%,28% 44%,32% 44%,32% 56%,98% 52%,32% 62%,32% 70%,28% 70%,28% 62%,4% 62%)}
.art.w13:after{clip-path:polygon(20% 92%,16% 56%,8% 42%,14% 36%,24% 48%,26% 22%,34% 20%,38% 44%,42% 12%,50% 12%,50% 44%,56% 20%,64% 22%,60% 48%,70% 36%,78% 42%,66% 66%,70% 92%)}
.art.w14:after{clip-path:polygon(24% 92%,20% 54%,14% 40%,20% 34%,28% 46%,32% 18%,40% 16%,42% 44%,50% 10%,58% 12%,56% 44%,64% 22%,72% 26%,66% 54%,74% 46%,80% 52%,70% 70%,72% 92%)}
.art.w15:after{clip-path:polygon(22% 92%,16% 50%,24% 30%,50% 18%,76% 30%,84% 50%,78% 92%)}
.art.cr:before{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 12px)}
.art.cr:after{inset:14px 24%;clip-path:none;border-radius:8px;border:2px solid rgba(255,255,255,.55);background:linear-gradient(180deg,hsl(var(--h) 70% 55%) 0 30%,hsl(var(--h) 60% 28%) 30%);box-shadow:0 0 22px hsl(var(--h) 90% 60%/.55)}
.nm{font-weight:800;font-size:13px;margin:8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:12px;color:var(--mu);margin:0 2px 2px}
.pr i{font-style:normal;color:var(--gold)}
.tag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:2px 8px;z-index:1}
.rar{height:3px;border-radius:3px;margin:6px 2px 0}
.c0{background:var(--r0)}.c1{background:var(--r1)}.c2{background:var(--r2)}.c3{background:var(--r3)}.c4{background:var(--r4)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--s1);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px}
.chip.x{color:var(--lose)}
.stake{background:var(--s1);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:10px}
.go{width:100%;margin-top:18px;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--ac),#ff5fc0);color:#fff;font:700 16px Unbounded,system-ui,sans-serif;transition:transform .15s,opacity .2s}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.4;cursor:not-allowed;background:var(--s2);color:var(--mu)}
.hint{text-align:center;color:var(--mu);font-size:13px;margin:10px 0 0;min-height:18px}
.res{margin-top:14px;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;animation:pop .35s}
.res .art{width:96px;flex:none}
.res.win{background:color-mix(in srgb,var(--win) 16%,var(--s1))}.res.lose{background:color-mix(in srgb,var(--lose) 14%,var(--s1))}
.res h3{margin:0;font:700 16px Unbounded,system-ui,sans-serif}
.res p{margin:4px 0 0;color:var(--mu);font-size:13px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.btn{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:var(--s2);font-weight:800;font-size:12px}
.btn.buy{background:var(--ac);color:#fff}
.empty{background:var(--s1);border-radius:16px;padding:22px;text-align:center;color:var(--mu)}
.empty button{margin-top:12px;background:var(--ac);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800}
.reset{display:block;margin:28px auto 0;background:none;color:var(--mu);text-decoration:underline;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;transition:.25s;z-index:9;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.stk{position:absolute;left:6px;bottom:4px;font-size:13px;z-index:1;background:rgba(0,0,0,.45);border-radius:99px;padding:0 5px}
.sa:after,.sa:before{display:none}
.roul{position:relative;overflow:hidden;background:var(--s1);border-radius:18px;padding:10px}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);z-index:2;box-shadow:0 0 12px var(--gold)}
.strip{display:flex;gap:8px;will-change:transform}
.cell{flex:0 0 112px;background:var(--s2);border-radius:12px;padding:6px}
.cell .art{height:56px}
.srch{width:100%;background:var(--s1);color:var(--tx);border:2px solid var(--s2);border-radius:14px;padding:12px 14px;font:inherit;margin-bottom:12px}
.srch:focus{outline:none;border-color:var(--ac)}
nav button{font-size:13px;padding:12px 4px}
.me{display:flex;gap:10px;align-items:center;background:none;font:700 15px Unbounded,system-ui,sans-serif;max-width:55%;padding:0;color:var(--tx)}
.me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:hsl(var(--h) 65% 45%);font-size:22px;box-shadow:0 0 0 2px var(--s2)}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:52px;margin:0 auto 10px}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
.eb{background:var(--s1);border-radius:14px;padding:10px 0;font-size:24px;border:2px solid transparent}
.eb.sel{border-color:var(--ac);background:var(--s2)}
.rg{width:100%;accent-color:var(--ac);margin-bottom:20px}
.art.ph{background:var(--im) center/cover no-repeat}.art.ph:before,.art.ph:after{display:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.slot{background:var(--s1);border-radius:14px;padding:6px;font-size:12px;font-weight:800;text-align:center;cursor:pointer}
.slot .art{height:52px;margin-bottom:4px}.slot span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 88%,transparent)}
nav{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 90%,transparent)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 4px}
.ni{font-size:19px;line-height:1}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.sum>div:not(.ar){flex:1;min-width:0}.sum>div:last-child{text-align:right}
.sum b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum small{display:block;color:var(--mu);font-size:12px}
.sum .ar{color:var(--ac);font-size:20px;font-weight:800}
.go{box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 35%,transparent)}
.go[disabled]{box-shadow:none}
.sec h2{font-size:14px;color:var(--tx);opacity:.75}
.chip{min-height:38px}
body{background:radial-gradient(900px 420px at 50% -120px,rgba(25,255,140,.14),transparent),var(--bg)}
.go:not([disabled]),nav button.on,.btn.buy,.empty button,.chip.on{color:#03150b}
.go{background:linear-gradient(135deg,#19ff8c,#00c96f)}
.go.alt{background:var(--s2);color:var(--ac);box-shadow:none;font-size:13px;padding:14px;margin-top:8px;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.go.alt:not([disabled]){color:var(--ac)}
.card.sel{box-shadow:0 0 0 1px var(--ac),0 0 18px rgba(25,255,140,.25)}
.mid b{text-shadow:0 0 14px rgba(25,255,140,.55)}
.arc{filter:drop-shadow(0 0 6px #19ff8c)}
.sign{text-align:center;font:800 28px Unbounded,system-ui,sans-serif;letter-spacing:.14em;padding:14px 0 0;color:#eafff4;text-shadow:0 0 4px #19ff8c,0 0 12px #19ff8c,0 0 28px #00ff7f,0 0 56px #00c46a;animation:flick 7s infinite}
.sign span+span{color:#19ff8c;margin-left:.3em}
@keyframes flick{0%,19%,21%,60%,62%,100%{opacity:1}20%,61%{opacity:.75}}
.art.crs:before,.art.crs:after{display:none}.art.crs svg{width:100%;height:100%;padding:4px}
.stage{height:132px;display:grid;place-items:center;overflow:hidden;margin:6px 0}
.crate{width:130px}.crate svg,.crate img{width:100%;filter:drop-shadow(0 0 18px rgba(25,255,140,.35))}
.crate.fall{animation:cfall .95s cubic-bezier(.3,.7,.4,1)}
.crate.pop{animation:cpop .35s forwards}
@keyframes cfall{0%{transform:translateY(-220px) rotate(-14deg);opacity:0}60%{transform:translateY(8px) rotate(3deg);opacity:1}80%{transform:translateY(-10px) rotate(-1deg)}100%{transform:none}}
@keyframes cpop{to{transform:scale(1.25);opacity:0}}
.coin{display:grid;place-items:center;height:78px;color:var(--ac);font:700 18px Unbounded,system-ui,sans-serif}
.mys{width:96px;height:74px;flex:none;display:grid;place-items:center;font-size:44px;animation:shk .5s infinite}
@keyframes shk{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s1);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row2 small{display:block;color:var(--mu);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="sign"><span>NEON</span><span>DROP</span></div>
  <header><button class="me" id="me" onclick="go('pf')" aria-label="Профиль"></button><div class="bal" id="bal"><i>◈</i><span id="balv">0</span></div></header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
window.onerror=function(m,u,l){var e=document.getElementById("main");if(e)e.innerHTML='<div class="empty">Ошибка: '+m+' (строка '+l+')</div>'};
const SK=[["Неоновый Шторм",50,300],["Пыльная Дюна",120,38],["Ледяной Шёпот",250,195],["Медный Закат",400,20],["Тихий Омут",700,215],["Изумрудный Клык",1100,150],["Ночной Рейс",1800,250],["Багровый Орден",2800,350],["Лунная Пыль",4200,265],["Золотая Лихорадка",6500,45],["Призрак Вулкана",10000,8],["Королевский Кобальт",16000,225],["Абсолютный Ноль",30000,180]].map((a,i)=>({id:i,n:a[0],p:a[1],h:a[2]}));
const KEY="upgrader-v1",EDGE=.95;
let st={bal:1000,inv:[],uid:1,fresh:1};
try{const s=localStorage.getItem(KEY);if(s)st=JSON.parse(s)}catch(e){}
if(!st||typeof st.bal!=="number"||!Array.isArray(st.inv))st={bal:1000,inv:[],uid:1,fresh:1};st.uid=st.uid||(st.inv.length+1)+100;st.stk=st.stk||[];st.pf=st.pf||{n:"Игрок",e:"🦊",c:260,img:""};st.im=st.im||{};st.inv=st.inv.filter(i=>i&&i.id<999);st.inv.forEach(i=>i.s=i.s||[]);
let tab="up",sel=new Set(),extra=0,target=null,R=0,busy=false,res=null,hint="";
const fmt=n=>Math.round(n).toLocaleString("ru-RU");
const rar=p=>p<300?"c0":p<1500?"c1":p<5000?"c2":p<12000?"c3":"c4";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function bump(){const b=document.getElementById("bal");b.classList.add("bump");setTimeout(()=>b.classList.remove("bump"),250)}
function card(s,o={}){return `<button class="card ${o.sel?"sel":""}" ${o.dis?"disabled":""} ${o.click?`onclick="${o.click}"`:""}>
<div ${ia("w"+s.t,s.h,"art w"+s.t)}>${o.tag?`<span class="tag">${o.tag}</span>`:""}${s.st&&s.st.length?`<span class="stk">${s.st.map(k=>STK[k].e).join("")}</span>`:""}</div>
<div class="nm">${s.n}</div><div class="pr"><i>◈</i> ${fmt(s.p)}</div><div class="rar ${rar(s.p)}"></div>${o.extra||""}</button>`}
function stakeVal(){let v=extra;sel.forEach(u=>{const it=st.inv.find(i=>i.uid===u);if(it)v+=itemVal(it)});return v}
function chance(){const s=stakeVal();if(!target&&target!==0||!s)return 0;return Math.min(.9,s/SK[target].p*EDGE)}
function check(){const s=stakeVal();if(!s)return"Выбери скины или добавь монеты в ставку";if(target===null)return"Выбери скин, который хочешь получить";if(SK[target].p<=s)return"Выбери скин дороже ставки";if(chance()<.0001)return"Шанс ниже 0.01% — увеличь ставку";return""}
function vUp(){
  const p=chance(),C=2*Math.PI*86,err=check();
  const stakeCards=st.inv.length?`<div class="row">${st.inv.slice().sort((a,b)=>itemVal(b)-itemVal(a)).map(i=>card(iv(i),{sel:sel.has(i.uid),click:`tog(${i.uid})`,tag:sel.has(i.uid)?"✓":""})).join("")}</div>`:`<div class="empty">В инвентаре пусто. Купи скин в магазине или сделай ставку монетами.</div>`;
  const tg=tgList().map(s=>card(s,{sel:target===s.id,click:`pick(${s.id})`,tag:stakeVal()?pct(Math.min(.9,stakeVal()/s.p*EDGE)):""})).join("");
  const r=resH();

  target=b.id;res=null;render();toast("Шанс "+pct(chance()));const e=document.querySelector(".card.sel[onclick^='pick']");if(e)e.scrollIntoView({inline:"center",block:"nearest"})}

function giveStart(){if(st.fresh){STARTERS.forEach(id=>st.inv.push({uid:st.uid++,id,s:[]}));delete st.fresh;save()}}
giveStart();

function selAll(){if(busy)return;st.inv.forEach(i=>sel.add(i.uid));fix();render()}

const FREE=[10,20,30,40,50],mmss=ms=>{const t=Math.ceil(ms/1000);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const rollCoin=m=>Math.max(1,Math.round(m*Math.pow(Math.random(),1.5)));
const coinCell=v=>`<div class="cell coin"><b>◈ ${v}</b></div>`;
const fcd=i=>st.inf?0:Math.max(0,((st.fc||{})[i]||0)+300000-Date.now());
let fs=null,fres=0;
function crateSvg(h){return `<svg viewBox="0 0 120 100" aria-hidden="true"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h} 70% 48%)"/><stop offset="1" stop-color="hsl(${h} 70% 18%)"/></linearGradient></defs><ellipse cx="60" cy="92" rx="42" ry="6" fill="rgba(0,0,0,.5)"/><path d="M14 36 60 20 106 36 106 80 60 92 14 80Z" fill="url(#g${h})" stroke="hsl(${h} 90% 70%)" stroke-width="2"/><path d="M14 36 60 52 106 36" fill="none" stroke="hsl(${h} 90% 75%)" stroke-width="2"/><path d="M60 52V92" stroke="#19ff8c" stroke-width="3"/><circle cx="60" cy="58" r="5" fill="#19ff8c"/></svg>`}
const stCrate=(h,i)=>st.im["c"+i]?`<img alt="" src="${st.im["c"+i]}">`:crateSvg(h);
function vCase(){
  if(fs!==null)return vFree();
  if(cs===null)return `<div class="sec"><h2>Бесплатные кейсы · монеты</h2><div class="grid">${FREE.map((m,i)=>{const cd=fcd(i);return `<button class="card" onclick="fs=${i};fres=0;render()"><div class="art crs" style="--h:${140+i*20}">${crateSvg(140+i*20)}</div><div class="nm">Бесплатный · до ◈ ${m}</div><div class="pr">${cd?"через "+mmss(cd):"можно открыть"}</div></button>`}).join("")}</div></div><div class="sec"><h2>Бесплатные кейсы · скины до ◈ 50</h2><div class="grid">${FSK.map((c,i)=>{const cd=fcd(5+i);return `<button class="card" onclick="fs=${5+i};fres=0;fdrop=null;render()"><div class="art crs" style="--h:${60+i*55}">${crateSvg(60+i*55)}</div><div class="nm">${c.n.replace("Бесплатный · ","Бесплатный: ")}</div><div class="pr">${cd?"через "+mmss(cd):"скин до ◈ 50"}</div></button>`}).join("")}</div></div><div class="sec"><h2>Кейсы · ${CB.length}</h2><div class="grid">${CB.map((c,i)=>`<button class="card" onclick="cs=${i};drop=null;render()"><div ${ia("c"+i,c.h,"art crs")}>${st.im["c"+i]?"":crateSvg(c.h)}</div><div class="nm">${c.n}</div><div class="pr"><i>◈</i> ${fmt(c.price)} · ${c.pool.length} предм.</div></button>`).join("")}</div></div>`;
  const c=CB[cs];
  return `<div class="sec"><button class="chip" onclick="if(!busy){cs=null;render()}">‹ Все кейсы</button><h2 style="margin-top:14px">${c.n}</h2><div class="stage"><div class="crate" id="crt">${stCrate(c.h,cs)}</div></div><div class="roul" id="rl"><div class="mk"></div><div class="strip" id="strip">${Array.from({length:12},()=>cellH(pickFrom(c))).join("")}</div></div><div id="cres">${resC()}</div><button class="go" id="cgo" onclick="openCase()" ${busy?"disabled":""}>Открыть за ◈ ${fmt(c.price)}</button></div><div class="sec"><h2>Что может выпасть · показано ${Math.min(40,c.pool.length)} из ${c.pool.length}</h2><div class="grid">${c.pool.map((s,i)=>[s,c.ws[i]/c.W]).reverse().slice(0,40).map(([s,w])=>card(s,{tag:(w*100).toFixed(w<.001?2:1)+"%"})).join("")}</div></div>`}
function rollStrip(cells,WI,done){const strip=document.getElementById("strip"),rl=document.getElementById("rl");strip.innerHTML=cells.join("");strip.style.transition="none";strip.style.transform="translateX(0)";strip.getBoundingClientRect();const off=WI*120+56-rl.clientWidth/2+(Math.random()*60-30);strip.style.transition="transform 5s cubic-bezier(.08,.7,.1,1)";strip.style.transform=`translateX(${-off}px)`;setTimeout(done,5100)}
function crateFall(then){const c=document.getElementById("crt");if(!c){then();return}c.classList.remove("pop");c.classList.add("fall");setTimeout(()=>{c.classList.add("pop");then()},980)}
function openCase(){const c=CB[cs];if(busy)return;if(st.bal<c.price){toast("Не хватает монет");return}
  busy=true;drop=null;st.bal-=c.price;navR();document.getElementById("cres").innerHTML="";document.getElementById("cgo").disabled=true;
  const win=pickFrom(c),WI=40;
  crateFall(()=>rollStrip(Array.from({length:46},(_,i)=>cellH(i===WI?win:pickFrom(c))),WI,()=>{busy=false;const uid=st.uid++;st.inv.push({uid,id:win.id,s:[]});drop={s:win,uid};save();navR();bump();document.getElementById("cres").innerHTML=resC();document.getElementById("cgo").disabled=false;toast("Выпало: "+win.n)}))}
setInterval(()=>{if(tab==="case"&&fs!==null&&!busy){const b=document.getElementById("fgo");if(b){const cd=fcd(fs);b.disabled=!!cd;b.textContent=cd?"Доступен через "+mmss(cd):"Открыть бесплатно"}}},1000);
const resH=()=>{if(!res)return"";if(res.shake)return `<div class="res"><div class="mys">🎁</div><div><h3>Открываем…</h3><p>Скин гарантирован</p></div></div>`;
  const a=SK[res.id],art=`<div ${ia("w"+a.t,a.h,"art w"+a.t)}></div>`;
  if(res.mys)return `<div class="res win">${art}<div><h3>Мистери!</h3><p>${esc(a.n)} · ◈ ${fmt(a.p)} · ×${res.m.toFixed(2)} от ставки</p></div></div>`;
  if(res.win)return `<div class="res win">${art}<div><h3>Победа!</h3><p>${esc(a.n)} теперь в инвентаре</p></div></div>`;
  return `<div class="res lose"><div><h3>Не повезло</h3><p>Утешительный приз: ◈ ${fmt(res.prize||0)}</p></div></div>`};
function mystery(){if(busy)return;const v=stakeVal();if(!v){toast("Добавь ставку");return}
  busy=true;st.bal-=extra;st.inv=st.inv.filter(i=>!sel.has(i.uid));
  const r=Math.random(),m=r<.5?.35+Math.random()*.55:r<.8?.9+Math.random()*.4:r<.95?1.3+Math.random()*1.7:3+Math.random()*7,T=v*m;
  const c=RK.slice().sort((a,b)=>Math.abs(Math.log(a.p/T))-Math.abs(Math.log(b.p/T))).slice(0,4),w=c[Math.floor(Math.random()*c.length)];
  res={shake:1};target=null;navR();render();
  setTimeout(()=>{busy=false;sel.clear();extra=0;st.inv.push({uid:st.uid++,id:w.id,s:[]});res={mys:1,id:w.id,m:w.p/v};save();render();bump();toast("Мистери: "+w.n);try{navigator.vibrate&&navigator.vibrate([40,30,40])}catch(e){}},2200)}
/* ---- онлайн: баттлы и трейды ---- */
let DB=null,ME=null,BT=[],TR=[],bres=null;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pickR=(c,rnd)=>{let r=rnd()*c.W;for(let i=0;i<c.pool.length;i++){r-=c.ws[i];if(r<=0)return c.pool[i]}return c.pool[0]};
async function mpInit(){try{const c=window.claude;if(!c||!c.use)return;const u=await c.use("user"),d=await c.use("db");if(!d||!u)return;const id=await u.id();if(!id)return;DB=d;ME=id;
  DB.collection("battles").limit(80).onSnapshot(s=>{BT=s.docs.map(x=>({id:x.id,...x.data()}));mpSync()},()=>{});
  DB.collection("trades").limit(80).onSnapshot(s=>{TR=s.docs.map(x=>({id:x.id,...x.data()}));mpSync()},()=>{});
  if(tab==="mp")render()}catch(e){DB=null}}
function mpSync(){st.bd=st.bd||[];st.ta=st.ta||[];let ch=0;
  for(const b of BT){if(b.state==="done"&&(b.host===ME||b.guest===ME)&&CB[b.ci]&&!st.bd.includes(b.id)){st.bd.push(b.id);if(st.bd.length>80)st.bd.shift();
    const c=CB[b.ci],rnd=mul(b.seed|0),dh=pickR(c,rnd),dg=pickR(c,rnd),won=(dh.p>=dg.p)===(b.host===ME);
    if(won)[dh,dg].forEach(k=>st.inv.push({uid:st.uid++,id:k.id,s:[]}));
    bres={dh,dg,won,hn:b.hn,gn:b.gn};ch=1;toast(won?"Баттл выигран!":"Баттл проигран")}}
  for(const t of TR){if(t.seller===ME&&t.state==="sold"&&!st.ta.includes(t.id)){st.ta.push(t.id);if(st.ta.length>80)st.ta.shift();st.bal+=Math.max(0,+t.ask||0);ch=1;toast("Трейд продан: +◈ "+fmt(t.ask));DB.doc("trades/"+t.id).delete().catch(()=>{})}}
  if(ch){save();navR();bump();rerMp()}
  const l=document.getElementById("mpl");if(tab==="mp"&&l)l.innerHTML=mpList()}
function rerMp(){if(tab==="mp"&&!/INPUT|SELECT/.test(document.activeElement.tagName))render()}
function mpList(){
  const rb=bres?`<div class="res ${bres.won?"win":"lose"}" style="flex-direction:column;align-items:stretch"><h3>${bres.won?"Победа в баттле!":"Поражение в баттле"}</h3><div style="display:flex;gap:10px"><div style="flex:1">${card(bres.dh,{})}</div><div style="flex:1">${card(bres.dg,{})}</div></div><p>${esc(bres.hn||"")} vs ${esc(bres.gn||"")} · победитель забирает оба скина</p></div>`:"";
  const ob=BT.filter(b=>b.state==="open"&&CB[b.ci]).sort((a,b)=>b.t-a.t).map(b=>`<div class="row2"><div><b>${esc(b.hn||"Игрок")}</b><small>${CB[b.ci].n} · ◈ ${fmt(b.price)}</small></div>${b.host===ME?`<button class="chip x" data-i="${esc(b.id)}" onclick="cancelBattle(this.dataset.i)">Отменить</button>`:`<button class="chip on" data-i="${esc(b.id)}" onclick="joinBattle(this.dataset.i)">Вступить</button>`}</div>`).join("")||`<div class="empty">Открытых баттлов нет. Создай первый!</div>`;
  const ot=TR.filter(t=>t.state==="open"&&SK[t.skin]).sort((a,b)=>b.t-a.t).map(t=>`<div class="row2"><div><b>${esc(SK[t.skin].n)} ${(t.stk||[]).filter(k=>STK[k]).map(k=>STK[k].e).join("")}</b><small>${esc(t.sn||"Игрок")} · цена ◈ ${fmt(t.ask)} (рынок ◈ ${fmt(SK[t.skin].p)})</small></div>${t.seller===ME?`<button class="chip x" data-i="${esc(t.id)}" onclick="cancelTrade(this.dataset.i)">Снять</button>`:`<button class="chip on" data-i="${esc(t.id)}" onclick="buyTrade(this.dataset.i)">Купить</button>`}</div>`).join("")||`<div class="empty">На рынке пока пусто</div>`;
  return `${rb}<h2>Открытые баттлы</h2>${ob}<h2 style="margin-top:20px">Рынок трейдов</h2>${ot}`}
function vMp(){if(!DB)return `<div class="sec"><div class="empty">Подключаемся к онлайну… Если не загрузилось, проверь интернет и обнови страницу.</div></div>`;
  return `<div class="sec"><h2>Создать баттл</h2><select class="srch" id="bsel">${CB.map((c,i)=>`<option value="${i}">${c.n} · ◈ ${fmt(c.price)}</option>`).join("")}</select><button class="go" style="margin-top:0" onclick="mkBattle()">Создать баттл</button><p class="hint" style="text-align:left">Оба открывают один кейс. У кого скин дороже, тот забирает оба.</p></div>
<div class="sec"><h2>Выставить скин на трейд</h2>${st.inv.length?`<select class="srch" id="tsel">${st.inv.map(i=>`<option value="${i.uid}">${esc(SK[i.id].n)} · ◈ ${fmt(itemVal(i))}</option>`).join("")}</select><input class="srch" id="task" type="number" min="1" placeholder="Цена в монетах"><button class="go" style="margin-top:0" onclick="mkTrade()">Выставить на трейд</button>`:`<div class="empty">В инвентаре нет скинов</div>`}</div><div class="sec" id="mpl">${mpList()}</div>`}
async function mkBattle(){const c=CB[+document.getElementById("bsel").value],ci=CB.indexOf(c);if(!DB)return;if(st.bal<c.price){toast("Не хватает монет");return}
  st.bal-=c.price;save();navR();
  try{await DB.collection("battles").add({host:ME,hn:nick().slice(0,16),ci,price:c.price,t:Date.now(),state:"open",guest:"",seed:Math.floor(Math.random()*1e9)});toast("Баттл создан, ждём соперника")}catch(e){st.bal+=c.price;save();navR();toast("Не удалось создать: нет прав записи")}}
async function cancelBattle(id){const b=BT.find(x=>x.id===id);if(!b||b.host!==ME||b.state!=="open")return;
  try{const r=DB.doc("battles/"+id),a=await r.acquire({holder:ME,ttlMs:5000});if(!a.acquired){toast("Баттл уже занят");return}const s=await r.get();if(!s.exists||s.data().state!=="open")return;await r.delete();st.bal+=b.price;save();navR();toast("Баттл отменён, монеты возвращены")}catch(e){toast("Ошибка")}}
async function joinBattle(id){const b=BT.find(x=>x.id===id);if(!b||b.host===ME||b.state!=="open"||!CB[b.ci])return;if(st.bal<b.price){toast("Не хватает монет");return}let paid=0;
  try{const r=DB.doc("battles/"+id),a=await r.acquire({holder:ME,ttlMs:8000});if(!a.acquired){toast("Кто-то уже вступает");return}const s=await r.get();if(!s.exists||s.data().state!=="open"){toast("Баттл уже занят");return}
    st.bal-=b.price;paid=1;save();navR();await r.update({state:"done",guest:ME,gn:nick().slice(0,16)})}catch(e){if(paid){st.bal+=b.price;save();navR()}toast("Не удалось вступить")}}
async function mkTrade(){if(!DB)return;const u=+document.getElementById("tsel").value,ask=Math.round(+document.getElementById("task").value),k=st.inv.findIndex(i=>i.uid===u);
  if(k<0){toast("Выбери скин");return}if(!(ask>=1)){toast("Укажи цену");return}const it=st.inv[k];st.inv.splice(k,1);sel.delete(u);save();navR();
  try{await DB.collection("trades").add({seller:ME,sn:nick().slice(0,16),skin:it.id,stk:it.s,ask,t:Date.now(),state:"open"});toast("Скин выставлен на рынок");render()}catch(e){st.inv.splice(k,0,it);save();navR();toast("Не удалось выставить: нет прав записи")}}
async function cancelTrade(id){const t=TR.find(x=>x.id===id);if(!t||t.seller!==ME||t.state!=="open")return;
  try{const r=DB.doc("trades/"+id),a=await r.acquire({holder:ME,ttlMs:5000});if(!a.acquired){toast("Уже покупают");return}const s=await r.get();if(!s.exists||s.data().state!=="open")return;await r.delete();st.inv.push({uid:st.uid++,id:t.skin,s:(t.stk||[]).filter(k=>STK[k]).slice(0,4)});save();navR();toast("Скин вернулся в инвентарь");rerMp()}catch(e){toast("Ошибка")}}
async function buyTrade(id){const t=TR.find(x=>x.id===id);if(!t||t.seller===ME||t.state!=="open"||!SK[t.skin])return;if(st.bal<t.ask){toast("Не хватает монет");return}let paid=0;
  try{const r=DB.doc("trades/"+id),a=await r.acquire({holder:ME,ttlMs:8000});if(!a.acquired){toast("Кто-то уже покупает");return}const s=await r.get();if(!s.exists||s.data().state!=="open"){toast("Уже продано");return}
    st.bal-=t.ask;paid=1;save();navR();await r.update({state:"sold",buyer:ME});st.inv.push({uid:st.uid++,id:t.skin,s:(t.stk||[]).filter(k=>STK[k]).slice(0,4)});save();navR();bump();toast("Куплено: "+SK[t.skin].n);rerMp()}catch(e){if(paid){st.bal+=t.ask;save();navR()}toast("Не удалось купить")}}

function vFree(){const sk=fs>=5,fc=sk?FSK[fs-5]:null,m=sk?0:FREE[fs],cd=fcd(fs),h=sk?60+(fs-5)*55:140+fs*20;
  const idle=Array.from({length:12},()=>sk?cellH(pickFrom(fc)):coinCell(rollCoin(m))).join("");
  const rs=sk?(fdrop?`<div class="res win"><div ${ia("w"+fdrop.t,fdrop.h,"art w"+fdrop.t)}></div><div><h3>${esc(fdrop.n)}</h3><p>◈ ${fmt(fdrop.p)} · уже в инвентаре</p></div></div>`:""):(fres?`<div class="res win"><div><h3>+ ◈ ${fres}</h3><p>Монеты уже на балансе</p></div></div>`:"");
  return `<div class="sec"><button class="chip" onclick="if(!busy){fs=null;render()}">‹ Все кейсы</button><h2 style="margin-top:14px">${sk?fc.n:"Бесплатный кейс · до ◈ "+m}</h2><div class="stage"><div class="crate" id="crt">${crateSvg(h)}</div></div><div class="roul" id="rl"><div class="mk"></div><div class="strip" id="strip">${idle}</div></div><div id="cres">${rs}</div><button class="go" id="fgo" onclick="openFree()" ${busy||cd?"disabled":""}>${cd?"Доступен через "+mmss(cd):"Открыть бесплатно"}</button></div>${sk?`<div class="sec"><h2>Что может выпасть · ${fc.pool.length} скинов</h2><div class="grid">${fc.pool.map(s=>card(s,{})).join("")}</div></div>`:""}`}
function openFree(){if(busy||fcd(fs))return;const sk=fs>=5,fc=sk?FSK[fs-5]:null,m=sk?0:FREE[fs],win=sk?pickFrom(fc):rollCoin(m),WI=40;busy=true;fres=0;fdrop=null;document.getElementById("cres").innerHTML="";document.getElementById("fgo").disabled=true;
  crateFall(()=>rollStrip(Array.from({length:46},(_,i)=>i===WI?(sk?cellH(win):coinCell(win)):(sk?cellH(pickFrom(fc)):coinCell(rollCoin(m)))),WI,()=>{busy=false;st.fc=st.fc||{};st.fc[fs]=Date.now();if(sk){st.inv.push({uid:st.uid++,id:win.id,s:[]});fdrop=win;toast("Выпало: "+win.n)}else{st.bal+=win;fres=win;toast("+ ◈ "+win)}save();render();bump()}))}
render();
mpInit();
</script>
